name: update-offers

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".ilang/**"
      - "scraper.py"
      - "build.py"
      - "ilang_site.py"
      - "templates/**"

permissions:
  contents: write

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape public pages
        run: python scraper.py

      - name: Build static site
        run: python build.py

      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json site
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: refresh public VPS offer snapshot"
            git push
          fi

      - name: Publish site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name=vps-deals-promo-radar --branch=main --commit-dirty=true
